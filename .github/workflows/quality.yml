name: Novel Forge quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python tools
        run: python -m compileall -q tools tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate project state
        run: python tools/validate_story_state.py

      - name: Validate emotion plan template
        run: python tools/validate_emotion_plan.py

      - name: Audit candidate sample
        run: python tools/novel_quality_audit.py --path examples/chapter-sample.md --fail-on P1

      - name: Score evaluation samples
        run: |
          python tools/score_chapter.py --path evals/cases/strong-opening.md --min-score 70
          python tools/score_chapter.py --path evals/cases/weak-ai-opening.md --format json

      - name: Confirm local-model policy
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path(".novel/novel-state.json").read_text(encoding="utf-8"))
          assert state["policy"]["local_models_allowed"] is False
          assert state["rank_scout_status"] == "data_required"
          print("local-model policy and market evidence gate are explicit")
          PY

      - name: Run repository quality suite
        run: python tools/run_quality_suite.py --json

      - name: Assemble prompt pack
        run: python tools/assemble_prompt_pack.py --output promptpacks/generated/novel-forge-core.md
